name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch: {} # lets you trigger a run manually via `gh workflow run`

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 0cc7327da4f3d67ccdcb0e075d72eccc # not sensitive — visible in the dashboard URL
          command: pages deploy . --project-name=drops-adventure --branch=main
