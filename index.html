<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Drops Adventure</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700&display=swap" rel="stylesheet">
<style>
  /* Work Sans — self-hosted from the real dropscandies.com CDN for brand
     parity. Note: the files at this URL are Regular (400), not Semibold
     (600) despite the original spec — see assets/fonts/README. Using the
     real weight avoids the browser synthetically (fake-)bolding a weight
     that doesn't actually exist in the file, which looks noticeably worse
     than a true semibold cut. Swap in a real 600 file the same way if one
     becomes available. */
  @font-face {
    font-family: "Work Sans";
    src: url("./assets/fonts/worksans_n4.woff2") format("woff2"),
         url("./assets/fonts/worksans_n4.woff") format("woff2");
    font-weight: 400; font-style: normal; font-display: swap;
  }
  /* Formiga (700) is a licensed commercial font (TipoType) — drop the webfont
     files in assets/fonts/ using these exact names and it takes over
     automatically. Until then, Baloo 2 stands in as a similarly bold,
     rounded display face so product names/descriptions still read right. */
  @font-face {
    font-family: "Formiga";
    src: url("./assets/fonts/Formiga-Bold.woff2") format("woff2"),
         url("./assets/fonts/Formiga-Bold.woff") format("woff");
    font-weight: 700; font-style: normal; font-display: swap;
  }
  html, body { margin:0; height:100%; overflow:hidden; background:#1a1030;
    font-family: "Work Sans", "Avenir Next", "Segoe UI", system-ui, sans-serif;
    font-weight: 400;
    touch-action:none; overscroll-behavior:none; -webkit-user-select:none; }
  /* Formiga 700 — product names & descriptions (game title, hero cards,
     gummy flavor names/effects, capture toast) */
  #card h1, .cname, .csub, .cdesc, .flavName, .flavFx, #toastName, #toastFx {
    font-family: "Formiga", "Baloo 2", "Work Sans", sans-serif;
    font-weight: 700;
  }
  canvas { display:block; touch-action:none; }
  #hud { position:fixed; inset:0; pointer-events:none; user-select:none; }
  .panel { background:linear-gradient(135deg, rgba(255,79,158,.72), rgba(255,148,64,.62) 55%, rgba(148,82,255,.7));
    border:1.5px solid rgba(255,255,255,.45); border-radius:16px; backdrop-filter: blur(8px);
    color:#fff; box-shadow:0 4px 22px rgba(120,30,120,.28); }
  #stats { position:absolute; top:14px; right:14px; padding:10px 16px; font-size:14px;
    line-height:1.55; text-align:right; letter-spacing:.04em; font-weight:400;
    text-shadow:0 1px 4px rgba(80,0,60,.4); }
  #stats b { color:#fff45e; font-variant-numeric:tabular-nums; }
  #cycle { position:absolute; top:14px; left:14px; padding:10px 16px; font-size:12px;
    letter-spacing:.1em; display:flex; align-items:center; gap:10px; font-weight:700;
    text-transform:uppercase; text-shadow:0 1px 4px rgba(80,0,60,.4); }
  #cycleDot { width:12px; height:12px; border-radius:50%; background:#ffd9a0;
    box-shadow:0 0 10px #ffd9a0; transition:background 1s, box-shadow 1s; }
  #cycleBar { width:90px; height:5px; border-radius:3px; background:rgba(255,255,255,.3);
    overflow:hidden; }
  #cycleFill { height:100%; width:0%; background:#fff; border-radius:3px; }
  #energyWrap { position:absolute; left:50%; bottom:26px; transform:translateX(-50%);
    width:min(420px, 70vw); padding:10px 16px 13px; }
  #energyLabel { font-size:11px; letter-spacing:.26em; margin-bottom:6px; font-weight:800;
    text-shadow:0 1px 4px rgba(80,0,60,.45); }
  #energyBar { height:15px; border-radius:8px; background:rgba(40,0,50,.5); overflow:hidden;
    border:1px solid rgba(255,255,255,.35); }
  #energyFill { height:100%; width:100%; border-radius:8px; transform-origin:left center;
    background:linear-gradient(90deg,#8dc63f,#fbb040,#f7941d,#ef4b5d); transition:background .4s; }
  #energyWrap.low #energyFill { background:linear-gradient(90deg,#ef4b5d,#c2185b); }
  #energyWrap.low { animation:pulse 0.9s ease-in-out infinite; }
  @keyframes pulse { 50% { transform:translateX(-50%) scale(1.02); } }
  #overlay { position:absolute; inset:0; display:flex; justify-content:center;
    pointer-events:auto; background:radial-gradient(ellipse at center, rgba(40,10,70,.22), rgba(26,8,48,.72));
    overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain;
    touch-action:pan-y; padding:24px 0 max(24px, env(safe-area-inset-bottom)); box-sizing:border-box; }
  #card { text-align:center; color:#fff; padding:30px 40px 26px; max-width:540px; margin:auto 0; }
  #card.wide { max-width:820px; width:min(820px, 92vw); }
  /* hero picker only — wide enough to keep all four cards on one row, matching
     the 3D lineup behind them. Narrow screens still wrap to a 2x2. */
  #card.heroes { max-width:980px; width:min(980px, 94vw); }
  #card h1 { margin:0 0 6px; font-size:52px; letter-spacing:.02em; font-weight:700;
    background:linear-gradient(92deg,#8dc63f 5%,#fbb040 30%,#f7941d 52%,#ef4b5d 75%,#c2185b 96%);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
    filter:drop-shadow(0 2px 10px rgba(255,255,255,.35)); }
  #card .tag { opacity:.95; margin-bottom:14px; font-size:15px; font-weight:400;
    text-shadow:0 1px 6px rgba(80,0,60,.5); }
  #card .chooseLabel { font-size:13px; letter-spacing:.3em; text-transform:uppercase;
    font-weight:800; margin:10px 0 12px; color:#fff45e; text-shadow:0 1px 6px rgba(80,0,60,.5); }
  .cards { display:flex; gap:14px; justify-content:center; margin-bottom:16px; flex-wrap:wrap; }
  .charCard { flex:1 1 170px; max-width:210px; box-sizing:border-box; padding:16px 14px 14px; border-radius:18px;
    cursor:pointer; position:relative; border:2px solid rgba(255,255,255,.55);
    transition:transform .15s ease, box-shadow .15s ease; text-shadow:0 1px 4px rgba(60,0,50,.45); }
  .charCard:nth-child(1) { background:linear-gradient(160deg,#ff4f9e,#ff8ad0 55%,#9452ff); }
  .charCard:nth-child(2) { background:linear-gradient(160deg,#3e6b4f,#8dc63f 60%,#fbb040); }
  .charCard:nth-child(3) { background:linear-gradient(160deg,#9452ff,#ef4b5d 60%,#fbb040); }
  .charCard:nth-child(4) { background:linear-gradient(160deg,#2b2630,#2f4f7a 55%,#ff7a1a); }
  .charCard:hover { transform:translateY(-4px) scale(1.04); box-shadow:0 10px 30px rgba(255,120,200,.45); }
  /* Narrower than a four-across row: go straight to a 2x2 rather than leaving a
     lone orphan card stranded on a second row. */
  @media (max-width: 880px) { .charCard { flex:1 1 calc(50% - 7px); max-width:none; } }
  @media (max-width: 420px) { .charCard { flex:1 1 100%; } }
  .charCard .key { position:absolute; top:8px; left:10px; width:22px; height:22px; line-height:22px;
    border-radius:7px; background:rgba(255,255,255,.9); color:#7a1d6b; font-weight:800; font-size:13px; }
  .charCard .cname { font-size:24px; font-weight:700; margin-top:4px; }
  .charCard .csub { font-size:12px; letter-spacing:.18em; text-transform:uppercase; font-weight:700;
    opacity:.95; margin-bottom:8px; }
  .charCard .cdesc { font-size:12.5px; line-height:1.5; opacity:.95; }
  #card .how { font-size:13px; line-height:1.8; opacity:.95; text-shadow:0 1px 5px rgba(60,0,50,.5); }
  #card .cta { margin-top:16px; font-size:15px; letter-spacing:.14em; font-weight:800; color:#fff45e;
    text-shadow:0 0 14px rgba(255,244,94,.6); animation:blink 1.6s ease-in-out infinite; }
  #card .big { font-size:26px; margin:8px 0 2px; font-weight:700; }
  #card .big b { color:#fff45e; }
  #card .dim { opacity:.85; font-size:13px; }
  @keyframes blink { 50% { opacity:.45; } }
  #muteBtn { position:absolute; right:14px; bottom:26px; width:46px; height:46px;
    border-radius:50%; border:1.5px solid rgba(255,255,255,.5); cursor:pointer;
    pointer-events:auto; font-size:21px; line-height:1; display:flex;
    align-items:center; justify-content:center; color:#fff;
    background:linear-gradient(135deg, rgba(255,79,158,.85), rgba(148,82,255,.85));
    box-shadow:0 4px 16px rgba(120,30,120,.35); transition:transform .12s ease; }
  #muteBtn:hover { transform:scale(1.1); }
  #muteBtn.muted { background:linear-gradient(135deg, rgba(90,90,110,.85), rgba(60,60,80,.85)); }
  #charBtn { position:absolute; right:14px; bottom:138px; width:46px; height:46px;
    border-radius:50%; border:1.5px solid rgba(255,255,255,.5); cursor:pointer;
    pointer-events:auto; font-size:21px; line-height:1; display:flex;
    align-items:center; justify-content:center; color:#fff;
    background:linear-gradient(135deg, rgba(141,198,63,.9), rgba(251,176,64,.9));
    box-shadow:0 4px 16px rgba(120,30,120,.35); transition:transform .12s ease; }
  #charBtn:hover { transform:scale(1.1); }
  .lbTitle { font-size:13px; letter-spacing:.3em; text-transform:uppercase; font-weight:800;
    margin:14px 0 8px; color:#fff45e; text-shadow:0 1px 6px rgba(80,0,60,.5); }
  .lb { display:flex; flex-direction:column; gap:4px; max-width:340px; margin:0 auto 6px; }
  .lbRow { display:grid; grid-template-columns:28px 70px 1fr 1fr; align-items:center;
    padding:5px 12px; border-radius:10px; background:rgba(255,255,255,.14);
    font-size:14px; font-weight:700; text-shadow:0 1px 4px rgba(60,0,50,.4); }
  .lbRow b { letter-spacing:.2em; }
  .lbRow.hl { background:linear-gradient(90deg, rgba(141,198,63,.75), rgba(251,176,64,.75));
    box-shadow:0 0 14px rgba(251,176,64,.5); }
  .lbEnter { margin:12px 0 8px; font-size:14px; font-weight:700; color:#fff45e;
    text-shadow:0 1px 6px rgba(80,0,60,.5); }
  .lbForm { display:flex; gap:10px; justify-content:center; margin-bottom:8px; }
  .lbForm input { width:110px; font-size:26px; text-transform:uppercase; text-align:center;
    letter-spacing:.3em; border-radius:12px; border:2px solid rgba(255,255,255,.6);
    background:rgba(40,0,50,.5); color:#fff; padding:8px 4px 8px 12px; font-weight:800;
    outline:none; font-family:inherit; }
  .lbForm input:focus { border-color:#fff45e; box-shadow:0 0 12px rgba(255,244,94,.5); }
  .lbForm input { touch-action:manipulation; }
  .ctaBtn { display:inline-block; margin:14px 6px 0; padding:10px 26px; border-radius:999px;
    border:2px solid rgba(255,255,255,.6); cursor:pointer; font-family:inherit;
    font-size:15px; letter-spacing:.14em; font-weight:800; color:#fff;
    background:linear-gradient(92deg,#f7941d,#ef4b5d); text-shadow:0 1px 4px rgba(60,0,50,.4);
    box-shadow:0 4px 18px rgba(239,75,93,.45); transition:transform .12s ease; }
  .ctaBtn.endGameBtn { background:linear-gradient(92deg, rgba(239,75,93,.95), rgba(150,20,60,.95)); }
  .ctaBtn:hover { transform:scale(1.06); }
  #toast { position:absolute; left:50%; top:15%; transform:translateX(-50%);
    text-align:center; opacity:0; pointer-events:none; }
  #toast.pop { animation:toastPop 2.8s cubic-bezier(.2,1.2,.4,1) forwards; }
  @keyframes toastPop {
    0% { opacity:0; transform:translateX(-50%) scale(.4); }
    10% { opacity:1; transform:translateX(-50%) scale(1.1); }
    18% { transform:translateX(-50%) scale(1); }
    78% { opacity:1; }
    100% { opacity:0; transform:translateX(-50%) translateY(-26px) scale(.92); }
  }
  #toastName { display:inline-block; font-size:32px; font-weight:700; letter-spacing:.06em;
    color:#fff; padding:8px 26px; border-radius:16px; border:2px solid rgba(255,255,255,.65);
    text-shadow:0 2px 8px rgba(0,0,0,.4); text-transform:uppercase; }
  #toastFx { display:inline-block; margin-top:8px; font-size:13px; letter-spacing:.26em;
    text-transform:uppercase; font-weight:800; color:#fff; background:rgba(30,10,40,.7);
    padding:5px 16px; border-radius:999px; border:1.5px solid rgba(255,255,255,.55); }
  #menuBtn, #stopBtn { position:absolute; right:14px; width:46px; height:46px;
    border-radius:50%; border:1.5px solid rgba(255,255,255,.5); cursor:pointer;
    pointer-events:auto; font-size:20px; line-height:1; display:flex;
    align-items:center; justify-content:center; color:#fff;
    box-shadow:0 4px 16px rgba(120,30,120,.35); transition:transform .12s ease; }
  #menuBtn { bottom:194px; background:linear-gradient(135deg, rgba(47,111,176,.9), rgba(148,82,255,.9)); }
  #stopBtn { bottom:82px; background:linear-gradient(135deg, rgba(239,75,93,.9), rgba(194,24,91,.9)); }
  #menuBtn:hover, #stopBtn:hover { transform:scale(1.1); }
  #flavBtn { position:absolute; right:14px; bottom:250px; width:46px; height:46px;
    border-radius:50%; border:1.5px solid rgba(255,255,255,.5); cursor:pointer;
    pointer-events:auto; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg, rgba(141,198,63,.95), rgba(94,160,40,.95));
    box-shadow:0 4px 16px rgba(120,30,120,.35); transition:transform .12s ease; }
  #flavBtn:hover { transform:scale(1.1); }
  #flavBtn .cube { width:20px; height:20px; border-radius:6px; display:block;
    background:linear-gradient(135deg,#c3ea7f,#8cc63e); transform:rotate(10deg);
    border:2px solid rgba(255,255,255,.8); box-shadow:inset 0 0 6px rgba(255,255,255,.5); }
  .flavGrid { display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr));
    gap:8px; margin:14px auto 6px; max-width:700px; }
  .flavRow { display:flex; align-items:center; gap:10px; border-radius:12px;
    padding:8px 12px; background:rgba(255,255,255,.15);
    text-shadow:0 1px 4px rgba(60,0,50,.4); }
  .flavCube { width:24px; height:24px; border-radius:7px; flex:none;
    border:2px solid rgba(255,255,255,.75); transform:rotate(8deg); }
  .flavName { font-weight:700; font-size:14.5px; flex:1; text-align:left; }
  .flavFx { font-size:10.5px; letter-spacing:.14em; text-transform:uppercase;
    font-weight:800; background:rgba(30,10,40,.6); padding:3px 10px; border-radius:999px; }
  /* interact prompt — sits above the hero, tappable on touch */
  #prompt { position:absolute; left:50%; top:58%; transform:translateX(-50%); display:none;
    pointer-events:auto; cursor:pointer; padding:9px 20px; border-radius:999px;
    font-size:14px; letter-spacing:.12em; text-transform:uppercase; font-weight:800;
    color:#fff; white-space:nowrap; border:2px solid rgba(255,255,255,.7);
    background:linear-gradient(135deg, rgba(239,75,93,.92), rgba(148,82,255,.92));
    box-shadow:0 4px 18px rgba(120,30,120,.45); text-shadow:0 1px 4px rgba(60,0,50,.5);
    animation:promptPulse 1.4s ease-in-out infinite; }
  #prompt::after { content:" · E"; opacity:.75; }
  .touch-ui #prompt::after { content:""; }
  @keyframes promptPulse { 50% { transform:translateX(-50%) scale(1.06); } }
  /* travel fade — covers the planet rebuild */
  #fade { position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; }
  #dev { position:fixed; left:8px; bottom:8px; color:#7be8b0; font:12px/1.5 monospace;
    background:rgba(0,0,0,.55); padding:6px 9px; border-radius:6px; display:none; white-space:pre; }
  .hidden { display:none !important; }

  /* touch controls (mobile) — hidden by default; game.js reveals them when a
     touch-capable device is detected and gameplay is active */
  #lookLayer { position:absolute; inset:0; touch-action:none; pointer-events:none; }
  #joyBase { position:absolute; left:22px; bottom:22px; width:124px; height:124px;
    border-radius:50%; display:none; align-items:center; justify-content:center;
    touch-action:none; pointer-events:auto;
    background:radial-gradient(circle, rgba(255,255,255,.16), rgba(255,255,255,.05) 70%);
    border:1.5px solid rgba(255,255,255,.4); }
  #joyKnob { width:56px; height:56px; border-radius:50%; pointer-events:none;
    background:linear-gradient(135deg, rgba(255,255,255,.95), rgba(255,220,240,.85));
    box-shadow:0 2px 12px rgba(0,0,0,.4); }
  .actionBtn { position:absolute; bottom:24px; width:70px; height:70px; border-radius:50%;
    border:1.5px solid rgba(255,255,255,.55); display:none; align-items:center; justify-content:center;
    font-size:28px; color:#fff; touch-action:none; pointer-events:auto;
    box-shadow:0 4px 16px rgba(120,30,120,.35); transition:transform .08s ease; }
  .actionBtn.pressed { transform:scale(.9); }
  #jumpBtn { right:96px; background:linear-gradient(135deg, rgba(251,176,64,.92), rgba(239,75,93,.92)); }
  #sprintBtn { right:182px; background:linear-gradient(135deg, rgba(43,182,255,.9), rgba(148,82,255,.9)); }
  /* touch mode: the joystick + action buttons occupy the bottom band, so
     lift the (otherwise bottom-centered) energy bar clear of them */
  .touch-ui #energyWrap { bottom:156px; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div id="lookLayer"></div>
  <div id="cycle" class="panel"><span id="cycleDot"></span><span id="cycleLabel"></span><div id="cycleBar"><div id="cycleFill"></div></div></div>
  <div id="stats" class="panel"></div>
  <div id="energyWrap" class="panel">
    <div id="energyLabel"></div>
    <div id="energyBar"><div id="energyFill"></div></div>
  </div>
  <div id="overlay"><div id="card" class="panel"></div></div>
  <div id="toast"><div><span id="toastName"></span></div><div><span id="toastFx"></span></div></div>
  <div id="prompt"></div>
  <div id="fade"></div>
  <button id="flavBtn" title="Gummy flavors" aria-label="Gummy flavors"><span class="cube"></span></button>
  <button id="menuBtn" title="Menu / pause" aria-label="Menu">☰</button>
  <button id="charBtn" title="Switch hero (C)" aria-label="Switch hero">🎭</button>
  <button id="stopBtn" title="Stop game — save your score" aria-label="Stop game">🏁</button>
  <button id="muteBtn" title="Mute (M)" aria-label="Mute">🔊</button>
  <div id="joyBase"><div id="joyKnob"></div></div>
  <button id="sprintBtn" class="actionBtn" title="Sprint" aria-label="Sprint">⚡</button>
  <button id="jumpBtn" class="actionBtn" title="Jump" aria-label="Jump">⤴</button>
  <div id="dev"></div>
</div>
<script type="module" src="./js/game.js"></script>
</body>
</html>
